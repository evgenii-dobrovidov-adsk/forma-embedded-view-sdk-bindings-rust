<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pick Point Forma Site Design Extension (Rust/WASM)</title>
  <script type="importmap">
    {
      "imports": {
        "forma-embedded-view-sdk": "https://esm.sh/forma-embedded-view-sdk@0.91.0",
        "forma-embedded-view-sdk/auto": "https://esm.sh/forma-embedded-view-sdk@0.91.0/auto"
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      color: #1a1a1a;
      background: #fff;
      font-size: 14px;
      line-height: 1.5;
    }
    h2 {
      font-size: 16px;
      margin-bottom: 8px;
    }
    p {
      color: #555;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    button {
      padding: 6px 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f5f5f5;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #e8e8e8; }
    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }
    .point-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 12px;
      padding: 12px;
      border: 1px solid #e3e3e3;
      border-radius: 6px;
      background: #fafafa;
    }
    .point-grid dt {
      font-weight: 600;
    }
    .point-grid dd {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    #status {
      margin-top: 16px;
      padding: 8px;
      border-radius: 4px;
      background: #f0f4ff;
      color: #334;
      min-height: 36px;
    }
  </style>
</head>
<body>
  <h2>Pick Point (Rust/WASM)</h2>
  <p>Click <strong>Pick point</strong>, then click somewhere in the Forma 3D scene to capture local coordinates.</p>
  <div class="row">
    <button id="btn-pick">Pick point</button>
    <button id="btn-clear">Clear</button>
  </div>
  <dl class="point-grid">
    <dt>X</dt>
    <dd id="point-x">-</dd>
    <dt>Y</dt>
    <dd id="point-y">-</dd>
    <dt>Z</dt>
    <dd id="point-z">-</dd>
  </dl>
  <div id="status">Initializing WASM…</div>

  <script type="module">
    import init from "./pkg/pick_point_extension.js";
    const wasm = await init();
    wasm.pick_point_extension_main();
  </script>
</body>
</html>
